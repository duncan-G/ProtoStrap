# The deploy workflow (docs/protostrap.md#deploy-workflow) turns a commit into a running
# release, with the Deploy role, in the account's deploy GitHub environment. It has two
# jobs:
#
#   build     It runs as one job per image missing from ECR (from plan.yml), in parallel,
#             building a Dockerfile with buildx, or a .NET project with the SDK's container
#             publish, using the SDK the project's global.json pins. ProtoStrap never picks
#             a .NET version. Every image is linux/arm64, for Graviton VMs: buildx runs a
#             Dockerfile's steps under QEMU, and the SDK cross-builds without it.
#   release   It copies what VMs need into the account, if it isn't there yet: the
#             protostrap binary of the release's version (which the infra workflow
#             usually published, so VMs boot with their agent), the edge and telemetry images,
#             and every stateful component's upstream image, since VMs never pull from
#             Docker Hub. It writes releases/<commit>.json, sends protostrap-deploy
#             <commit> to data-1 through SSM, and waits for its result: done, or failed
#             and rolled back.
#
# A release is the whole application at one commit, so rolling back is deploying an
# earlier commit again: its images are still in ECR.
name: deploy

on:
  workflow_call:
    inputs:
      environment:
        type: string
        required: true
      spec:
        type: string
        default: protostrap.yaml
      version:
        description: The ProtoStrap version the release runs (plan.yml's output).
        type: string
        required: true
      builds:
        description: The images to build (plan.yml's output).
        type: string
        default: "[]"
      protostrap-repository:
        type: string
        default: duncan-G/protostrap
      protostrap-ref:
        description: The ProtoStrap version to build the CLI and the edge and telemetry images from. Empty uses this repository, which is ProtoStrap itself.
        type: string
        default: ""

permissions:
  contents: read
  id-token: write

jobs:
  build:
    if: inputs.builds != '[]' && inputs.builds != ''
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    strategy:
      fail-fast: true
      matrix:
        build: ${{ fromJSON(inputs.builds) }}
    name: build ${{ matrix.build.component }}
    steps:
      - uses: actions/checkout@v5

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2

      # A component with a build directory is built from its Dockerfile, for arm64 under
      # QEMU on the x86 runner.
      - uses: docker/setup-qemu-action@v4
        if: matrix.build.project == ''
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v4
        if: matrix.build.project == ''

      - name: Build and push ${{ matrix.build.image }}
        if: matrix.build.project == ''
        run: |
          docker buildx build --platform linux/arm64 \
            --file "${{ matrix.build.dockerfile }}" \
            --tag "${{ matrix.build.image }}" \
            --label "org.opencontainers.image.revision=${{ github.sha }}" \
            --provenance=false --push \
            "${{ matrix.build.context }}"

      # A component with a project is built with the .NET SDK's container publish, using
      # the SDK its global.json pins. protostrap plan found it, the nearest one at or above
      # the project's directory, and refuses a project without one.
      - uses: actions/setup-dotnet@v6
        if: matrix.build.project != ''
        with:
          global-json-file: ${{ matrix.build.global_json }}

      - name: Publish and push ${{ matrix.build.image }}
        if: matrix.build.project != ''
        shell: bash
        env:
          PROJECT: ${{ matrix.build.project }}
          IMAGE: ${{ matrix.build.image }}
        run: |
          set -euo pipefail
          # The image is <registry>/protostrap/<component>:<tag>, as plan.yml worked it out.
          registry=${IMAGE%%/*}
          rest=${IMAGE#*/}
          # The SDK reads global.json from the directory it runs in, not the project's, and
          # the runner has SDKs of its own, so the publish runs in the project's directory.
          cd "$(dirname "$PROJECT")"
          dotnet publish "$(basename "$PROJECT")" --configuration Release --os linux --arch arm64 \
            -t:PublishContainer \
            -p:ContainerRegistry="$registry" \
            -p:ContainerRepository="${rest%:*}" \
            -p:ContainerImageTag="${rest##*:}"

  release:
    needs: build
    if: always() && (needs.build.result == 'success' || needs.build.result == 'skipped')
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    concurrency:
      group: deploy-${{ inputs.environment }}
      cancel-in-progress: false
    env:
      SPEC: ${{ inputs.spec }}
      VERSION: ${{ inputs.version }}
      REGISTRY: ${{ vars.PROTOSTRAP_REGISTRY }}
      DEPLOY_BUCKET: ${{ vars.PROTOSTRAP_DEPLOY_BUCKET }}
    steps:
      - uses: actions/checkout@v5

      - if: inputs.protostrap-ref != ''
        uses: actions/checkout@v5
        with:
          repository: ${{ inputs.protostrap-repository }}
          ref: ${{ inputs.protostrap-ref }}
          path: .protostrap

      - id: source
        run: echo "dir=${{ inputs.protostrap-ref != '' && '.protostrap' || '.' }}" >> "$GITHUB_OUTPUT"

      - id: cli
        uses: ./.github/actions/protostrap
        if: inputs.protostrap-ref == ''
        with:
          version: ${{ inputs.version }}

      - id: cli-external
        uses: ./.protostrap/.github/actions/protostrap
        if: inputs.protostrap-ref != ''
        with:
          source: .protostrap
          version: ${{ inputs.version }}

      # The credentials last two hours: the job waits for the rollout, which may take up to
      # 80 minutes.
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-duration-seconds: 7200

      - uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v4

      # VMs run the arm64 build of the same source; the runner uses its own. The infra
      # workflow has usually published this version already.
      - name: The protostrap binary
        env:
          BINARY: ${{ steps.cli.outputs.vm-binary || steps.cli-external.outputs.vm-binary }}
          SOURCE: ${{ steps.source.outputs.dir }}
        run: '"$SOURCE/.github/actions/protostrap/publish.sh" "$BINARY" "$VERSION" "$DEPLOY_BUCKET"'

      - name: The edge image
        env:
          SOURCE: ${{ steps.source.outputs.dir }}
          BINARY: ${{ steps.cli.outputs.vm-binary || steps.cli-external.outputs.vm-binary }}
        run: |
          set -euo pipefail
          if aws ecr describe-images --repository-name protostrap/edge --image-ids "imageTag=$VERSION" >/dev/null 2>&1; then
            echo "edge $VERSION is in ECR"
            exit 0
          fi
          cp "$BINARY" "$SOURCE/edge/protostrap"
          # Its Dockerfile only copies files, so it needs no QEMU.
          docker buildx build --platform linux/arm64 --provenance=false --push \
            --tag "$REGISTRY/protostrap/edge:$VERSION" "$SOURCE/edge"

      - name: The telemetry image
        env:
          SOURCE: ${{ steps.source.outputs.dir }}
          BINARY: ${{ steps.cli.outputs.vm-binary || steps.cli-external.outputs.vm-binary }}
        run: |
          set -euo pipefail
          if aws ecr describe-images --repository-name protostrap/telemetry --image-ids "imageTag=$VERSION" >/dev/null 2>&1; then
            echo "telemetry $VERSION is in ECR"
            exit 0
          fi
          cp "$BINARY" "$SOURCE/telemetry/protostrap"
          # Like the edge's, its Dockerfile only copies files, so it needs no QEMU.
          docker buildx build --platform linux/arm64 --provenance=false --push \
            --tag "$REGISTRY/protostrap/telemetry:$VERSION" "$SOURCE/telemetry"

      - name: Stateful components' images
        run: |
          set -euo pipefail
          protostrap plan --spec "$SPEC" --registry "$REGISTRY" --version "$VERSION" --json > plan.json
          jq -c '.stateful[]' plan.json | while read -r s; do
            component=$(jq -r .component <<<"$s")
            upstream=$(jq -r .upstream <<<"$s")
            image=$(jq -r .image <<<"$s")
            tag=${image##*:}
            if aws ecr describe-images --repository-name "protostrap/$component" --image-ids "imageTag=$tag" >/dev/null 2>&1; then
              echo "$component: $tag is in ECR"
            else
              docker pull --platform linux/arm64 "$upstream"
              docker tag "$upstream" "$image"
              docker push "$image"
            fi
          done

      - name: Write the release
        run: |
          set -euo pipefail
          protostrap release --spec "$SPEC" --registry "$REGISTRY" --version "$VERSION" \
            --commit "${{ github.sha }}" --out release.json
          aws s3 cp --only-show-errors release.json "s3://$DEPLOY_BUCKET/releases/${{ github.sha }}.json"

      - name: Deploy it
        run: |
          set -euo pipefail
          app=$(jq -r .app plan.json)
          instance=$(aws ec2 describe-instances \
            --filters "Name=tag:protostrap:vm,Values=data-1" "Name=instance-state-name,Values=running" \
            --query 'Reservations[].Instances[].InstanceId' --output text)
          if [ -z "$instance" ]; then
            echo "::error::data-1 isn't running: apply the infra workflow first"
            exit 1
          fi
          command=$(aws ssm send-command --instance-ids "$instance" --document-name protostrap-deploy \
            --parameters "commit=${{ github.sha }}" --timeout-seconds 600 \
            --cloud-watch-output-config "CloudWatchOutputEnabled=true,CloudWatchLogGroupName=/protostrap/$app/deploy" \
            --query Command.CommandId --output text)
          echo "protostrap-deploy ${{ github.sha }}: command $command on $instance"
          # The command runs for at most 90 minutes (the protostrap-deploy document). An
          # invocation that can't be read is retried, but not for ever: expired credentials
          # would otherwise look like a command still pending.
          status=Pending
          deadline=$((SECONDS + 95 * 60))
          failures=0
          while :; do
            sleep 10
            if status=$(aws ssm get-command-invocation --command-id "$command" --instance-id "$instance" \
              --query Status --output text 2>err.txt); then
              failures=0
            else
              failures=$((failures + 1))
              status=Pending
              # Just after sending, the invocation may not exist yet.
              if [ "$failures" -ge 30 ]; then
                echo "::error::can't read the deploy command's status: $(cat err.txt)"
                exit 1
              fi
            fi
            case "$status" in
              Pending|InProgress|Delayed) ;;
              *) break ;;
            esac
            if [ "$SECONDS" -gt "$deadline" ]; then
              echo "::error::the deploy command is still $status after 95 minutes: see /protostrap/$app/deploy"
              exit 1
            fi
          done
          aws ssm get-command-invocation --command-id "$command" --instance-id "$instance" \
            --query StandardOutputContent --output text
          aws ssm get-command-invocation --command-id "$command" --instance-id "$instance" \
            --query StandardErrorContent --output text >&2
          echo "status: $status (full output in /protostrap/$app/deploy)"
          [ "$status" = Success ]
