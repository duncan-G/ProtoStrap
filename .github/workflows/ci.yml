# This workflow runs ProtoStrap's own checks: the Go tests, the spec checker on the sample,
# ProtoStrap.Hosting's tests, and the Terraform modules' formatting, validation and mocked
# tests.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go test -race ./...
      - run: go run ./cmd/protostrap check --spec sample/protostrap.yaml

  hosting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      # The tests build Go programs, and list what ./cmd/protostrap is built from, with the Go
      # that go.mod names.
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # The tests trace real projects with `dotnet msbuild`, and generate the spec that the Go
      # tests read back from hosting/tests/ProtoStrap.Hosting.Tests/Golden.
      - run: dotnet test hosting/ProtoStrap.Hosting.slnx
      - run: git diff --exit-code hosting/tests/ProtoStrap.Hosting.Tests/Golden

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: hashicorp/setup-terraform@v4
        with:
          # The platform's tests use run blocks' state_key, which Terraform 1.10 can't parse.
          terraform_version: 1.16.1
      - run: terraform fmt -check -recursive infra sample/infra
      - name: Validate
        run: |
          set -euo pipefail
          for dir in infra/bootstrap infra/platform infra/people sample/infra/bootstrap sample/infra/dev; do
            echo "::group::$dir"
            terraform -chdir="$dir" init -backend=false -input=false
            terraform -chdir="$dir" validate
            echo "::endgroup::"
          done
      - name: Test the platform with mocked providers
        run: terraform -chdir=infra/platform test
