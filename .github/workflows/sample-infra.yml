# This workflow runs Terraform for the sample's infrastructure in the dev account,
# sample/infra/dev, which builds the platform from sample/protostrap.yaml. It runs on
# changes to infra/bootstrap, infra/platform or the sample's infra, and by hand to plan,
# apply or destroy.
#
# An application's own repository has a copy of this, calling
# duncan-G/protostrap/.github/workflows/infra.yml@<version> with protostrap-ref set.
name: sample-infra

on:
  push:
    branches: [main]
    paths:
      - infra/bootstrap/**
      - infra/platform/**
      - sample/infra/dev/**
      - sample/protostrap.yaml
  workflow_dispatch:
    inputs:
      action:
        description: Terraform action
        type: choice
        options: [plan, apply, destroy]
        default: plan

jobs:
  infra:
    uses: ./.github/workflows/infra.yml
    with:
      environment: dev
      directory: sample/infra/dev
      spec: sample/protostrap.yaml
      action: ${{ github.event_name == 'push' && 'apply' || inputs.action }}
    secrets: inherit
