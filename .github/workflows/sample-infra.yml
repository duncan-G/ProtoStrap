# This workflow runs Terraform for the sample's infrastructure in the dev account,
# sample/infra/dev, which builds the platform from sample/protostrap.yaml. It runs only by
# hand, to plan, apply or destroy, so nothing reaches AWS until the dev account is
# bootstrapped and someone asks for a change.
#
# An application's own repository has a copy of this, calling
# duncan-G/protostrap/.github/workflows/infra.yml@<version> with protostrap-ref set.
name: sample-infra

on:
  workflow_dispatch:
    inputs:
      action:
        description: Terraform action
        type: choice
        options: [plan, apply, destroy]
        default: plan

# The reusable workflow signs in to AWS with GitHub's OIDC token.
permissions:
  contents: read
  id-token: write

jobs:
  infra:
    uses: ./.github/workflows/infra.yml
    with:
      environment: dev
      directory: sample/infra/dev
      spec: sample/protostrap.yaml
      action: ${{ inputs.action }}
    secrets: inherit
