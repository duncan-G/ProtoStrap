# PostgreSQL's client authentication (docs/config.md#postgresqls-pg_hbaconf). The agent
# delivers this file with each release, and the spec's on_config_change checks and reloads
# it without restarting PostgreSQL.

# The socket inside the container trusts: the backup and the hooks use it.
local   all   all                 trust

# Over the network, every connection needs the password.
host    all   all   0.0.0.0/0     scram-sha-256
host    all   all   ::/0          scram-sha-256
