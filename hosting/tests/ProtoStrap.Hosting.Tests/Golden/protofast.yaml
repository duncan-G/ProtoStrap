# Generated by ProtoStrap.Hosting 0.1.1 from apphost/Test.AppHost.csproj.
# Do not edit: change the AppHost, then run `aspire do protostrap-spec`.
app: protofast
protostrap: 1.4.0

pools:
  ingress: { vm: c8g.medium }
  general:
    vm: [m7g.large, m6g.large, m8g.large, m7gd.large]
    min: 1
    max: 6
    spare: 1
    target: 70%
    reserved: { cpu: 400m, memory: 1Gi }
  compute:
    vm: [c7g.xlarge, c6g.xlarge, c8g.xlarge, c7gd.xlarge]
    min: 0
    max: 4
    spare: 0
    target: 85%
    reserved: { cpu: 400m, memory: 1Gi }
  data: { vm: m7g.xlarge, count: 1 }

cdn:
  rate_limit: { requests: 300, period: 10s }
  waf:
    - { name: scanners, paths: [/wp-admin/, /.env], action: block }
    - { name: admin-abroad, hosts: [admin], not_countries: [US, CA], action: managed_challenge }
    - { name: bots, expression: http.user_agent contains "sqlmap", action: block }
  cache:
    - { name: assets, hosts: [app], paths: [/assets/], edge_ttl: 30d, browser_ttl: 1d }
    - { name: api, paths: [/api/], cache: false }

tunnel: {}

gateway:
  request: { cpu: 500m, memory: 256Mi }
  hosts:
    admin: admin.protofast.dev
    app: protofast.dev
    auth: auth.protofast.dev
  upstreams:
    api:
      routes: [app/api/]
    payments:
      routes: [app/payments/]

telemetry: {}

queues:
  protofast-document-upload: {}
  protofast-workflow-outcomes: { fifo: true }

buckets:
  documents: { browser: true, versions: 7d, lock: true }

components:
  api:
    kind: service
    project: services/api/src/ProtoFast.Api/ProtoFast.Api.csproj
    sources:
      - global.json
      - nuget.config
      - services/api/src/ProtoFast.Api
      - services/api/src/ProtoFast.Data
      - services/document_import/src/ProtoFast.DocumentImport.Core
      - services/document_import/src/ProtoFast.DocumentImport.Data
      - services/document_import/src/ProtoFast.DocumentImport.Engine
      - services/document_import/src/ProtoFast.DocumentImport.Storage
      - services/shared/Database
      - services/shared/Database.Abstractions
      - services/shared/Exceptions
      - services/shared/Grpc
      - services/shared/ServiceDefaults
      - services/shared/Storage
      - services/shared/Storage.Abstractions
    pool: general
    request: { cpu: 500m, memory: 512Mi }
    port: 8080
    ready: grpc
    depends_on: [postgres, redis]
    uses: [documents, protofast-document-upload]
    migrate: protofast-db-migrations
    env:
      Api_Sqs__DocumentImport__QueueName: protofast-document-upload
      OTEL_DOTNET_EXPERIMENTAL_OTLP_RETRY: in_memory
    secrets: [ConnectionStrings__protofast, ConnectionStrings__redis]
    stop: 30s
    scale: { min: 2, max: 10, demand: [{ cpu: 70% }] }

  conversion:
    kind: service
    build: services/conversion
    sources:
      - ":(exclude,glob)services/conversion/tests"
      - ":(exclude,glob)services/conversion/tests/**"
    pool: compute
    request: { cpu: 1000m, memory: 2Gi }
    port: 8090
    ready: /healthz
    uses: [documents]
    scale: { min: 1, max: 4, demand: [{ cpu: 70% }] }

  document-import:
    kind: worker
    project: services/document_import/src/ProtoFast.DocumentImport.Worker/ProtoFast.DocumentImport.Worker.csproj
    sources:
      - global.json
      - nuget.config
      - services/document_import/src/ProtoFast.DocumentImport.Core
      - services/document_import/src/ProtoFast.DocumentImport.Data
      - services/document_import/src/ProtoFast.DocumentImport.Engine
      - services/document_import/src/ProtoFast.DocumentImport.Storage
      - services/document_import/src/ProtoFast.DocumentImport.Worker
      - services/shared/Database
      - services/shared/Database.Abstractions
      - services/shared/Exceptions
      - services/shared/ServiceDefaults
      - services/shared/Storage
      - services/shared/Storage.Abstractions
    pool: compute
    request: { cpu: 1000m, memory: 1Gi }
    depends_on: [postgres]
    uses: [documents, protofast-workflow-outcomes]
    env:
      DocumentImport_Conversion__BaseUrl: http://conversion:8090
      OTEL_DOTNET_EXPERIMENTAL_OTLP_RETRY: in_memory
    secrets: [ConnectionStrings__protofast]
    stop: 2m
    scale: { min: 0, max: 20, demand: [{ queue: protofast-document-upload, rate: 2/s, drain: 1m }] }

  payments:
    kind: service
    project: services/payments/src/ProtoFast.Payments.Api/ProtoFast.Payments.Api.csproj
    sources:
      - global.json
      - nuget.config
      - services/payments/src/ProtoFast.Payments.Api
      - services/shared/ServiceDefaults
    pool: general
    request: { cpu: 250m, memory: 256Mi }
    port: 8080
    ready: grpc
    env:
      OTEL_DOTNET_EXPERIMENTAL_OTLP_RETRY: in_memory

  postgres:
    kind: stateful
    image: postgres:18.3
    vm: data-1
    request: { cpu: 2000m, memory: 8Gi }
    port: 5432
    env:
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
      POSTGRES_PASSWORD_FILE: /run/secrets/POSTGRES_PASSWORD
    secrets: [POSTGRES_PASSWORD]
    secret_files: true
    on_secret_change:
      - sh
      - -c
      - printf '%s\n' '\set pw `cat /run/secrets/POSTGRES_PASSWORD`' "ALTER ROLE postgres PASSWORD :'pw';" | psql -X -q -v ON_ERROR_STOP=1 -U postgres -d postgres
    volume: { path: /var/lib/postgresql, size: 100Gi }
    backup: [pg_dumpall, -U, postgres]

  protofast-db-migrations:
    kind: task
    project: services/api/src/ProtoFast.SchemaMigrations/ProtoFast.SchemaMigrations.csproj
    sources:
      - global.json
      - nuget.config
      - services/api/src/ProtoFast.Data
      - services/api/src/ProtoFast.SchemaMigrations
      - services/shared/Database
      - services/shared/Database.Abstractions
    pool: general
    request: { cpu: 250m, memory: 256Mi }
    depends_on: [postgres]
    env:
      OTEL_DOTNET_EXPERIMENTAL_OTLP_RETRY: in_memory
    secrets: [ConnectionStrings__protofast]

  redis:
    kind: stateful
    image: redis:8.6
    command: [sh, -c, exec docker-entrypoint.sh redis-server --requirepass "$(cat /run/secrets/REDIS_PASSWORD)"]
    vm: data-1
    request: { cpu: 500m, memory: 2Gi }
    port: 6379
    secrets: [REDIS_PASSWORD]
    secret_files: true
    on_secret_change:
      - sh
      - -c
      - for f in /run/secrets/REDIS_PASSWORD /run/secrets/previous/REDIS_PASSWORD; do [ -f "$f" ] && REDISCLI_AUTH="$(cat "$f")" redis-cli --no-auth-warning -x CONFIG SET requirepass </run/secrets/REDIS_PASSWORD | grep -qx OK && exit 0; done; exit 1
    volume: { path: /data, size: 10Gi }
    backup: [sh, -c, REDISCLI_AUTH="$(cat /run/secrets/REDIS_PASSWORD)" exec redis-cli --no-auth-warning --rdb -]
